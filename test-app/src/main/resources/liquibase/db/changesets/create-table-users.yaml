databaseChangeLog:
  - changeSet:
      id: 2
      author: A. Churyumova
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                  remarks: "Уникальный идентификатор пользователя"
              - column:
                  name: name
                  type: varchar(32)
                  constraints:
                    nullable: false
                  remarks: "Имя пользователя"
              - column:
                  name: email
                  type: varchar(32)
                  constraints:
                    nullable: false
                  remarks: "Электронная почта пользователя"
              - column:
                  name: password
                  type: varchar(32)
                  constraints:
                    nullable: false
                  remarks: "Пароль пользователя"
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
                  remarks: "Статус пользователя"
        - insert:
            tableName: users
            columns:
              - column:
                  name: id
                  value: "123e4567-e89b-12d3-a456-426614174009"
              - column:
                  name: name
                  value: "John Doe"
              - column:
                  name: email
                  value: "email"
              - column:
                  name: password
                  value: "password"
              - column:
                  name: status
                  value: "ADMIN"